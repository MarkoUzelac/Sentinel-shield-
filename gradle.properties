# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=4
kotlin.compiler.execution.strategy=in-process
googleServices.missing.passthrough=true
# TEMPORARY compatibility bridge for the current built-in Kotlin + KSP migration.
# Remove this flag once all generated Kotlin/Java source wiring is migrated to android.sourceSets.
android.disallowKotlinSourceSets=false
