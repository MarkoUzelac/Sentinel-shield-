name: Evidence Gate

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Android / tests / release / lint / artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle configuration
        run: ./gradlew tasks --all --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble release
        env:
          RELEASE_SIGNING_REQUIRED: 'false'
        run: ./gradlew assembleRelease --stacktrace

      - name: Android lint
        run: ./gradlew lint --stacktrace

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit)"
          test -n "$artifact"
          test -s "$artifact"
          echo "Release artifact: $artifact"
