name: Android CI

on:
  push:
    branches: ["main", "fix/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build / test / lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-cleanup: always
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify Android project structure
        run: |
          set -euo pipefail
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          chmod +x gradlew

      - name: Verify Gradle configuration
        run: ./gradlew tasks --all --stacktrace --no-daemon

      - name: Assemble release
        env:
          RELEASE_SIGNING_REQUIRED: 'false'
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Unit tests
        run: ./gradlew test --stacktrace --no-daemon

      - name: Android lint
        run: ./gradlew lint --stacktrace --no-daemon

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print)
          test "${#artifacts[@]}" -ge 1
          for artifact in "${artifacts[@]}"; do
            test -s "$artifact"
            echo "Release artifact: $artifact"
          done

  dependency-security:
    name: Dependency and secret security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Dependency review
        if: github.event_name == 'pull_request'
        continue-on-error: true
        id: dependency-review
        uses: actions/dependency-review-action@v4
      - name: Dependency review fallback
        if: github.event_name == 'pull_request' && steps.dependency-review.outcome == 'failure'
        run: echo "Dependency review API unavailable; secret audit remains authoritative."
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate:
    name: Production gate
    if: always()
    needs: [build-and-test, dependency-security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        run: |
          test "${{ needs.build-and-test.result }}" = "success"
          test "${{ needs.dependency-security.result }}" = "success"
