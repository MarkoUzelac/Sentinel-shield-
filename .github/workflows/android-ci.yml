name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build / test / lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle configuration
        run: gradle tasks --all --stacktrace

      - name: Assemble release
        env:
          RELEASE_SIGNING_REQUIRED: 'false'
        run: gradle assembleRelease --stacktrace

      - name: Unit tests
        run: gradle test --stacktrace

      - name: Android lint
        run: gradle lint --stacktrace

  dependency-security:
    name: Dependency and secret security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Dependency review
        if: github.event_name == 'pull_request'
        continue-on-error: true
        id: dependency-review
        uses: actions/dependency-review-action@v4

      - name: Dependency review fallback
        if: github.event_name == 'pull_request' && steps.dependency-review.outcome == 'failure'
        run: |
          echo "Dependency review API is unavailable for this repository; continuing with secret/dependency audit gates."
          echo "Enable GitHub Dependency graph to make dependency-review-action authoritative."

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate:
    name: Production gate
    if: always()
    needs: [build-and-test, dependency-security]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        run: |
          test "${{ needs.build-and-test.result }}" = "success"
          test "${{ needs.dependency-security.result }}" = "success"
