name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  build-apk:
    name: Build and upload APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37"
      - name: Verify project
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
      - name: Assemble release APK
        env:
          RELEASE_SIGNING_REQUIRED: 'false'
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Run unit tests
        run: gradle --no-daemon --stacktrace test
      - name: Run Android lint
        run: gradle --no-daemon --stacktrace lint
      - name: Verify APK
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "Verified $apk"
      - name: Verify APK with apksigner
        run: |
          set -euo pipefail
          apksigner_path="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose "$APK_PATH"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-shield-release-apk-${{ github.sha }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
