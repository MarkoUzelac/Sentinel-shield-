name: Web CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Typecheck, Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run Linter
        run: npm run lint

      - name: Run Unit & Component Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -d dist || { echo "dist directory missing"; exit 1; }
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/server.cjs || { echo "dist/server.cjs missing"; exit 1; }
          echo "Production artifacts verified successfully."
